services:
  db:
    image: postgres:16-alpine
    container_name: order-flow-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: order_flow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - order_flow_db_data:/var/lib/postgresql/data
volumes:
  order_flow_db_data:
